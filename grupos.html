<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grupo Santtorini</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse 65% 55% at 18% 12%, rgba(200, 50, 36, 0.58) 0%, transparent 65%),
        radial-gradient(ellipse 50% 45% at 82% 80%, rgba(158, 28, 22, 0.46) 0%, transparent 62%),
        radial-gradient(ellipse 55% 55% at 88% 8%,  rgba(52,  7,  5, 0.68) 0%, transparent 58%),
        radial-gradient(ellipse 50% 38% at 12% 92%, rgba(42,  5,  4, 0.62) 0%, transparent 58%),
        #6E1210;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      padding: 48px 20px 56px;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 55% 50% at 50% 50%, rgba(185, 42, 30, 0.18) 0%, transparent 65%);
      animation: pulse 9s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    body::after { display: none; }

    @keyframes pulse {
      0%   { opacity: 0.5; }
      100% { opacity: 1.0; }
    }

    /* ── CARD ─────────────────────────────────────────── */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── LOGO ─────────────────────────────────────────── */
    .logo-wrap {
      margin-bottom: 20px;
    }

    .logo-wrap img {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.35);
    }

    /* ── BRAND NAME ───────────────────────────────────── */
    .brand-name {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: normal;
      color: #fff;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .brand-tagline {
      font-size: 0.85rem;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 32px;
    }

    /* ── DIVISOR ──────────────────────────────────────── */
    .divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      margin-bottom: 28px;
    }

    /* ── TEXTO PRINCIPAL ──────────────────────────────── */
    .group-heading {
      font-size: 1.3rem;
      font-weight: 600;
      color: #fff;
      text-align: center;
      line-height: 1.35;
      margin-bottom: 14px;
      /* ✏️ Edite o texto do H1 aqui */
    }

    .group-sub {
      font-size: 0.88rem;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.72);
      text-align: center;
      line-height: 1.7;
      margin-bottom: 36px;
      max-width: 380px;
      /* ✏️ Edite o subtítulo aqui */
    }

    /* ── BOTÃO PRINCIPAL ──────────────────────────────── */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 24px;
      text-decoration: none;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: normal;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .link-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.85);
      transform: translateY(-1px);
    }

    .link-btn:active {
      transform: translateY(0);
    }

    /* ícone dentro do botão */
    .bi {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .bi svg {
      width: 18px;
      height: 18px;
      fill: #fff;
    }

    /* ── SOCIAL ROW ───────────────────────────────────── */
    .social-row {
      display: flex;
      gap: 16px;
      margin-top: 40px;
      margin-bottom: 4px;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      color: #fff;
      text-decoration: none;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
      background: rgba(255, 255, 255, 0.08);
    }

    .social-btn svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.85);
      transform: translateY(-2px);
    }

    /* ── FOOTER ───────────────────────────────────────── */
    .footer {
      margin-top: 28px;
      font-size: 0.7rem;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.3);
    }

    /* ── MOBILE ───────────────────────────────────────── */
    @media (max-width: 480px) {
      body {
        padding: 36px 16px 48px;
        align-items: flex-start;
      }

      .card {
        max-width: 100%;
      }

      .logo-wrap img {
        width: 76px;
        height: 76px;
      }

      .brand-name {
        font-size: 1.3rem;
      }

      .group-heading {
        font-size: 1.15rem;
      }

      .link-btn {
        font-size: 0.88rem;
        padding: 14px 20px;
      }
    }
  </style>
</head>
<body>
